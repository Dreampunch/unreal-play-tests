<!doctype html>
<!-- A play-test run's report (unreal-play-tests). Each run's folder (Saved/TestRecordings/<run>/) gets a copy of this page
     when its first test starts, and previous.js beside it (every case's results in earlier runs: see framework.md);
     every test that ends adds a line to results.js beside it (LW.push({...})), and when recorded its video <case>.mp4
     and a still <case>.jpg. Open it while the run goes (it picks up new results) or after. Dark only; every fact in its
     own box with an icon; buttons raised with a gradient. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play tests</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e0f11; --paper: #17191c; --side: #131518; --chip: #212429; --ink: #e8e8e5; --soft: #a3a7ad; --faint: #62666d; --rule: #2c3035;
    --pass: #3ccf6e; --fail: #ff5245; --fail-bg: #2e1513; --fail-rule: #5c2520;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  svg.i { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* the page: a side nav, and the report beside it */
  .layout { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
  nav { position: sticky; top: 0; height: 100vh; overflow: auto; background: var(--side); border-right: 1px solid var(--rule); padding: 18px 12px; display: grid; align-content: start; gap: 6px; }
  .navtitle { display: flex; align-items: center; gap: 8px; padding: 4px 8px 14px; font-weight: 700; font-size: 15px; }
  .navlink { display: grid; grid-template-columns: 15px 1fr auto; align-items: center; gap: 9px; padding: 8px 10px; color: var(--ink); text-decoration: none; border: 1px solid transparent; font-size: 14px; }
  .navlink svg { color: var(--soft); }
  .navlink:hover { background: var(--chip); border-color: var(--rule); }
  .navlink.on { background: var(--chip); border-color: #4a5059; }
  .navlink.on svg { color: var(--ink); }
  .navlink.sub { margin-left: 18px; padding: 5px 10px; font-size: 13px; color: var(--soft); }
  .navlink.sub.on { color: var(--ink); }
  .navlink.sub.positive svg { color: #8fb4e3; } .navlink.sub.negative svg { color: #b99be6; } .navlink.sub.boundary svg { color: #e2b867; }
  .count { display: inline-flex; align-items: center; gap: 6px; padding: 1px 7px; background: var(--bg); border: 1px solid var(--rule); font-size: 12px; font-variant-numeric: tabular-nums; }
  .navsep { height: 1px; background: var(--rule); margin: 10px 4px; }
  main { padding: 28px 32px 80px; max-width: 1400px; width: 100%; }
  section, .kindhead { scroll-margin-top: 16px; }
  section + section { margin-top: 36px; }

  /* a fact: an icon and a value in a box of its own */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; background: var(--chip); border: 1px solid var(--rule); font-size: 13px; color: var(--ink); white-space: nowrap; }
  .chip svg { color: var(--soft); }
  .chip.good svg { color: var(--pass); }
  .chip.bad { border-color: var(--fail-rule); background: var(--fail-bg); }
  .chip.bad svg { color: var(--fail); }
  .chip.warn { border-color: #5c4a1c; background: #2a2212; }
  .chip.warn svg { color: #ffb81c; }
  table.sum td.warn { color: #ffb81c; }

  /* buttons: raised, with a gradient */
  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; cursor: pointer; font: 600 13px system-ui, "Segoe UI", sans-serif;
    color: var(--ink); background: linear-gradient(180deg, #3a3f47 0%, #262a30 100%); border: 1px solid #4a5059; border-bottom-color: #1a1d21;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 1px 2px rgba(0,0,0,0.5); }
  .btn svg { color: var(--ink); }
  .btn:hover { background: linear-gradient(180deg, #474d57 0%, #2e3239 100%); border-color: #5b626c; }
  .btn:active { background: linear-gradient(180deg, #24272c 0%, #30353c 100%); box-shadow: inset 0 1px 3px rgba(0,0,0,0.6); }
  .btn:focus-visible { outline: 2px solid var(--soft); outline-offset: 2px; }
  .btn[aria-pressed="true"] { background: linear-gradient(180deg, #7a2b24 0%, #4a1713 100%); border-color: #a23a30; border-bottom-color: #2a0d0a; }
  nav .btn { justify-content: center; margin-top: 4px; }

  .sechead { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
  .sechead h2 { margin: 0; font-size: 22px; font-weight: 700; }
  /* a kind's heading: a band of its own colour across the section (blue, violet, amber: never green or red, which mean
     passed and failed) */
  /* the history: a square per run (green, red, or grey when the test didn't run), a line of its game time */
  table.hist td.c { width: 20px; padding: 9px 2px; text-align: center; }
  table.hist th.c { padding: 6px 2px; text-align: center; font-size: 10px; line-height: 1.2; font-weight: 500; writing-mode: vertical-rl; transform: rotate(180deg); height: 92px; }
  table.hist th.c.now { color: var(--ink); font-weight: 700; }
  .sq.none { background: var(--rule); }
  .sq.flaky { outline: 2px solid #ffb81c; outline-offset: 1px; }
  svg.spark { width: 120px; height: 22px; display: block; stroke: var(--soft); fill: none; stroke-width: 1.5; }
  .kindhead { display: flex; align-items: center; gap: 10px; margin: 28px 0 12px; padding: 10px 14px;
    background: #1f2a38; border: 1px solid #33465e; color: #8fb4e3; }
  .kindhead.negative { background: #2b2238; border-color: #4a3863; color: #b99be6; }
  .kindhead.boundary { background: #33291a; border-color: #5a4626; color: #e2b867; }
  .kindhead.untagged { background: var(--chip); border-color: var(--rule); color: var(--soft); }
  .sechead + .kindhead { margin-top: 4px; }
  .kindhead svg.i { width: 17px; height: 17px; }
  .kindhead h3 { margin: 0; font-size: 16px; font-weight: 700; color: var(--ink); }
  .kindhead .count { background: rgba(0,0,0,0.25); border-color: currentColor; color: var(--ink); }

  /* the summary */
  .tally { font-size: 44px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; margin: 6px 0 14px; }
  .tally .bad { color: var(--fail); }
  .tally .good { color: var(--pass); }
  .strip { display: flex; gap: 3px; margin: 14px 0 22px; }
  .strip a { flex: 1; height: 10px; background: var(--pass); }
  .strip a.fail { background: var(--fail); }
  table.sum { width: 100%; border-collapse: collapse; background: var(--paper); border: 1px solid var(--rule); font-size: 14px; }
  table.sum + table.sum { margin-top: 18px; }
  table.sum th { text-align: left; font-size: 12px; font-weight: 600; color: var(--soft); padding: 9px 12px; border-bottom: 1px solid var(--rule); background: var(--side); }
  table.sum td { padding: 9px 12px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  table.sum tr:last-child td { border-bottom: 0; }
  table.sum td.n { font-variant-numeric: tabular-nums; }
  table.sum td.bad { color: var(--fail); font-weight: 600; }
  table.sum a { color: var(--ink); font-family: var(--mono); font-size: 13px; }
  table.sum .cat { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
  table.sum .cat svg { color: var(--soft); }
  .boxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .box { border: 1px solid var(--rule); background: var(--paper); }
  .box > .head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; font-size: 13px; font-weight: 600; color: var(--soft); border-bottom: 1px solid var(--rule); }
  .box > .head .sq { margin-right: 2px; }
  .box > .body { padding: 12px; }
  .rows { list-style: none; margin: 0; padding: 0; }
  .rows li { display: grid; grid-template-columns: 12px 1fr auto; align-items: center; gap: 10px; padding: 7px 12px; font-size: 14px; }
  .rows li + li { border-top: 1px solid var(--rule); }
  .rows a { color: var(--ink); text-decoration: none; font-family: var(--mono); font-size: 13px; }
  .rows a:hover { text-decoration: underline; }
  .rows .msg { grid-column: 2 / -1; color: var(--soft); font-size: 13px; }

  /* the tests */
  .tests { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .test { background: var(--paper); border: 1px solid var(--rule); cursor: pointer; text-align: left; padding: 0; font: inherit; color: inherit; display: flex; flex-direction: column; }
  .test:hover, .test:focus-visible { border-color: var(--soft); outline: none; }
  .thumb { aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }   /* <case>.jpg: the wide view at its end */
  .nothumb { aspect-ratio: 16 / 9; background: #1b1d21; color: var(--faint); display: grid; place-items: center; font-size: 13px; }
  .test .body { padding: 10px 12px 12px; display: grid; gap: 8px; }
  .name { font: 600 15px var(--mono); word-break: break-all; display: flex; align-items: center; gap: 9px; }
  .sq { display: inline-block; vertical-align: middle; flex: none; width: 12px; height: 12px; background: var(--pass); }   /* the result: a green or red square */
  .fail .sq, .sq.fail { background: var(--fail); }
  .why { display: flex; gap: 8px; padding: 8px 10px; background: var(--fail-bg); border: 1px solid var(--fail-rule); font-size: 13px; }
  .why svg { color: var(--fail); margin-top: 2px; }
  .why span { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  /* a test opened: the whole window, the video as large as fits, its steps in a column beside it */
  dialog { border: 0; padding: 0; width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; background: #000; color: var(--ink); }
  dialog::backdrop { background: #000; }
  .detail { display: grid; grid-template-columns: 1fr 340px; height: 100%; }
  .detail video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
  .detail .nothumb { height: 100%; aspect-ratio: auto; }
  .side { padding: 16px; overflow: auto; height: 100vh; background: var(--paper); border-left: 1px solid var(--rule); display: grid; align-content: start; gap: 14px; }
  .sidehead { display: flex; align-items: flex-start; gap: 12px; }
  .sidehead h2 { flex: 1; min-width: 0; margin: 0; padding-top: 4px; font: 700 17px/1.3 var(--mono); display: flex; align-items: baseline; gap: 9px; }
  .sidehead h2 .sq { flex: none; }
  .sidehead h2 span:last-child { min-width: 0; overflow-wrap: anywhere; }
  .side .box { background: var(--bg); }
  .side .box > .head { padding: 7px 10px; font-size: 12px; }
  .steps { list-style: none; margin: 0; padding: 0; }
  .steps li { display: grid; grid-template-columns: 22px 1fr auto; gap: 9px; align-items: center; padding: 6px 10px; font-size: 14px; }
  .steps li + li { border-top: 1px solid var(--rule); }
  .mark { width: 22px; height: 22px; display: grid; place-items: center; background: var(--chip); border: 1px solid var(--rule); }
  .mark svg { width: 13px; height: 13px; stroke-width: 2.6; }
  .done .mark { color: var(--pass); }
  .failed .mark { color: var(--fail); border-color: var(--fail-rule); background: var(--fail-bg); }
  .failed > span { color: var(--fail); font-weight: 600; }
  .notreached { color: var(--faint); }
  .notreached .mark { color: var(--faint); }
  .steps .chip { padding: 2px 7px; font-variant-numeric: tabular-nums; }
  .memory { list-style: none; margin: 0; padding: 0; }
  .memory li { padding: 6px 10px; font-size: 13px; color: var(--ink); }
  .memory li + li { border-top: 1px solid var(--rule); }
  .memory .empty { color: var(--faint); }
  .close { flex: none; }
  .nothing { padding: 30px 0; color: var(--soft); }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    nav { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--rule); }
    main { padding: 20px 16px 60px; }
    .detail { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } .side { height: auto; border-left: 0; }
  }
</style>
</head>
<body>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<dialog id="dlg"></dialog>

<script>var LW = [];   // var: results.js read again on the side fills window.LW</script>
<script src="results.js"></script>
<script>var LWPrev = {};   // every case's results before this run, oldest first (previous.js, written as the run starts)</script>
<script src="previous.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const secs = s => s == null ? '' : s < 60 ? s.toFixed(1) + ' s' : (r => Math.floor(r / 60) + ' min ' + r % 60 + ' s')(Math.round(s));
  const slug = c => 'sec-' + c.toLowerCase().replace(/[^a-z0-9]+/g, '-');

  // line icons, drawn on a 24 x 24 grid
  const PATHS = {
    summary: '<rect x="4" y="4" width="16" height="16"/><path d="M8 15v-3M12 15V9M16 15v-5"/>',
    robot: '<rect x="5" y="8" width="14" height="11"/><path d="M12 4v4M9 13h.01M15 13h.01M2 13h3M19 13h3"/>',
    train: '<rect x="6" y="3" width="12" height="13"/><path d="M6 11h12M9 16l-2 4M15 16l2 4M9 7h6"/>',
    folder: '<path d="M3 6h7l2 2h9v11H3z"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    steps: '<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>',
    flag: '<path d="M5 21V4h11l-2 4 2 4H5"/>',
    calendar: '<rect x="4" y="5" width="16" height="16"/><path d="M4 10h16M9 3v4M15 3v4"/>',
    tests: '<rect x="4" y="4" width="16" height="16"/><path d="m8 12 3 3 5-6"/>',
    monitor: '<rect x="3" y="4" width="18" height="12"/><path d="M8 20h8M12 16v4"/>',
    terminal: '<rect x="3" y="4" width="18" height="16"/><path d="m7 9 3 3-3 3M13 15h4"/>',
    gauge: '<path d="M4 18a8 8 0 1 1 16 0"/><path d="m12 14 4-5"/>',
    filter: '<path d="M4 5h16l-6 8v6l-4-2v-4z"/>',
    slow: '<path d="M3 17h18M6 17V9h6l3 4h3v4"/><circle cx="8" cy="19" r="1"/>',
    check: '<path d="m5 12 5 5 9-10"/>',
    x: '<path d="M6 6l12 12M18 6 6 18"/>',
    dash: '<path d="M7 12h10"/>',
    alert: '<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5h.01"/>',
    positive: '<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
    negative: '<circle cx="12" cy="12" r="9"/><path d="m6 6 12 12"/>',
    boundary: '<path d="M3 8h18v8H3z"/><path d="M7 8v3M11 8v4M15 8v3M19 8v4"/>',
    bug: '<rect x="8" y="7" width="8" height="12" rx="4"/><path d="M12 7V4M8 11H4M16 11h4M8 16H5M16 16h3M9 4l1 2M15 4l-1 2"/>',
    history: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',
    version: '<circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 8v8M18 10c0 4-6 3-10 7"/>',
    flaky: '<path d="M3 12h4l3-7 4 14 3-7h4"/>',
    slower: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',
    plusbox: '<rect x="4" y="4" width="16" height="16"/><path d="M12 8v8M8 12h8"/>',
  };
  const CAT_ICON = { Robots: 'robot', Characters: 'robot', Trains: 'train' };   // a category's icon: add yours (PATHS below)
  const icon = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${PATHS[n] || PATHS.folder}</svg>`;
  const chip = (n, text, title = '', cls = '') => `<span class="chip ${cls}"${title ? ` title="${esc(title)}"` : ''}>${icon(n)}${esc(text)}</span>`;

  // the latest result per case (a case run twice in one run keeps its last), failures first, then in run order
  const byCase = new Map();
  LW.forEach((t, i) => byCase.set(t.case, { ...t, order: i }));
  const tests = [...byCase.values()].sort((a, b) => (a.result === 'pass') - (b.result === 'pass') || a.order - b.order);
  const failed = tests.filter(t => t.result !== 'pass');
  const cat = t => t.category || 'Robots';
  const cats = [...new Set([...byCase.values()].sort((a, b) => a.order - b.order).map(cat))];
  const inCat = c => tests.filter(t => cat(t) === c);
  let onlyFailed = false;

  // against the runs before (previous.js: each case's earlier results, oldest first). A regression used to pass and now
  // fails; fixed is the other way; new has no result before. Flaky: it passed and failed on this same version of the game
  // (commit and uncommitted changes), so the result isn't the code's: not a regression, whatever the last run said
  const history = t => { const h = LWPrev[t.case]; return Array.isArray(h) ? h : h ? [h] : []; };
  const before = t => history(t).at(-1);
  const flakyVersions = t => { const by = {};
    [...history(t), t].filter(r => r.version).forEach(r => (by[r.version] = by[r.version] || new Set()).add(r.result === 'pass'));
    return Object.keys(by).filter(v => by[v].size > 1); };
  const flakyNow = t => !!t.version && flakyVersions(t).includes(t.version);
  const sameVersion = t => [...history(t), t].filter(r => r.version && r.version === t.version);
  const change = t => { if (flakyNow(t)) return 'flaky';
    const p = before(t); if (!p) return 'new'; const was = p.result === 'pass', now = t.result === 'pass';
    return was && !now ? 'regression' : !was && now ? 'fixed' : now ? 'passing' : 'failing'; };
  // its game time against its last five passes: a walk that takes far longer than it did is wandering, even when it passes
  const timeShift = t => { const ref = history(t).filter(r => r.result === 'pass' && r.seconds != null && (r.mode || '') === (t.mode || '')).slice(-5).map(r => r.seconds).sort((a, b) => a - b);
    if (t.result !== 'pass' || ref.length < 2) return null; const med = ref[ref.length >> 1];
    return Math.abs(t.seconds - med) > 1 && Math.abs(t.seconds / med - 1) > 0.25 ? { med, ratio: t.seconds / med } : null; };
  const hasPrev = Object.keys(LWPrev).length > 0;
  const regressions = tests.filter(t => change(t) === 'regression'), fixed = tests.filter(t => change(t) === 'fixed'),
    fresh = hasPrev ? tests.filter(t => change(t) === 'new') : [], flaky = tests.filter(flakyNow), shifted = tests.filter(timeShift);
  const ver = r => r && (r.version || r.commit) ? (r.version || r.commit) : 'an unknown version';
  const KINDS = ['positive', 'negative', 'boundary'];
  const KIND_TIP = { positive: 'Positive: it does what it should', negative: 'Negative: it refuses or stops when it should', boundary: 'Boundary: just inside and just outside a limit' };
  const kindOf = t => t.kind || (t.kinds || [])[0] || '';   // one kind a test: what its name says it proves (older runs: kinds)
  const kindChips = t => (kindOf(t) ? chip(kindOf(t), kindOf(t), KIND_TIP[kindOf(t)]) : '') + (t.bug ? chip('bug', 'from a bug', t.bug) : '');
  const changeChip = t => { const c = change(t), p = before(t), sh = timeShift(t);
    const time = sh ? chip('slower', `${sh.ratio > 1 ? 'slower' : 'faster'}: ${secs(t.seconds)}, was ${secs(sh.med)}`, 'Game time against its last five passes in the same mode', 'warn') : '';
    if (c === 'flaky') { const n = sameVersion(t), ok = n.filter(r => r.result === 'pass').length;
      return chip('flaky', `flaky: passed ${ok} of ${n.length}`, `on version ${t.version}: the same code passed and failed`, 'warn') + time; }
    if (c === 'regression') return chip('history', 'regression: passed before', `passed in run ${p.run} at ${ver(p)}, fails at ${ver(t)}`, 'bad') + time;
    if (c === 'fixed') return chip('history', 'fixed since last run', `failed in run ${p.run} at ${ver(p)}: ${p.message}`, 'good') + time;
    if (c === 'new' && hasPrev) return chip('plusbox', 'new test') + time;
    return time; };

  const folder = decodeURIComponent(location.pathname.split('/').slice(-2, -1)[0] || '');
  const runName = folder.replace('_', ' ').replace(/-(\d\d)-(\d\d)$/, ':$1:$2');

  function navHtml() {
    const link = (id, ic, label, count, bad) => `<a class="navlink" href="#${id}" data-sec="${id}">${icon(ic)}<span>${esc(label)}</span>`
      + (count == null ? '<span></span>' : `<span class="count">${bad != null ? `<span class="sq ${bad ? 'fail' : ''}" style="width:8px;height:8px"></span>` : ''}${count}</span>`) + '</a>';
    return `<div class="navtitle">${icon('tests')}Play tests</div>`
      + link('sec-summary', 'summary', 'Summary')
      + cats.map(c => link(slug(c), CAT_ICON[c], c, inCat(c).length, inCat(c).some(t => t.result !== 'pass'))
        + [...KINDS, ''].map(k => { const g = inCat(c).filter(t => kindOf(t) === k); if (!g.length) return '';
            return link(`${slug(c)}-${k || 'untagged'}`, k || 'alert', k ? k[0].toUpperCase() + k.slice(1) : 'Untagged', g.length, g.some(t => t.result !== 'pass'))
              .replace('class="navlink"', `class="navlink sub ${k}" data-parent="${slug(c)}"`); }).join('')).join('')
      + (hasPrev ? link('sec-history', 'history', 'History', flaky.length || null, flaky.length ? true : null) : '')
      + '<div class="navsep"></div>'
      + `<button class="btn" id="onlyFailed" aria-pressed="${onlyFailed}">${icon('filter')}${onlyFailed ? 'Showing failed only' : `Failed only (${failed.length})`}</button>`;
  }

  function summaryHtml() {
    if (!tests.length) return `<section id="sec-summary"><div class="chips">${chip('calendar', 'Run ' + runName)}</div><div class="tally">No results yet</div></section>`;
    const total = tests.reduce((n, t) => n + t.seconds, 0), first = tests[0];
    const tally = failed.length
      ? `<span class="bad">${failed.length} failed</span>, ${tests.length - failed.length} passed`
      : `<span class="good">All ${tests.length} passed</span>`;
    const facts = chip('calendar', 'Run ' + runName, 'When the run started') + chip('tests', `${tests.length} tests`)
      + chip('clock', `${secs(total)} game time`, 'The robots\' time, all tests together')
      + chip(first.mode === 'headless' ? 'terminal' : 'monitor', first.mode) + chip('gauge', `speed ${first.speed}x`)
      + chip('flag', `ended ${LW[LW.length - 1].ended.slice(11)}`, LW[LW.length - 1].ended)
      + (first.commit ? chip('version', `${first.branch ? first.branch + ' ' : ''}${first.commit}`, `The game's version: commit ${first.commit}${first.uncommitted ? ` with uncommitted changes (version ${first.version})` : ''}`)
        + (first.uncommitted ? chip('alert', `${first.uncommitted} uncommitted file${first.uncommitted === 1 ? '' : 's'}`, 'Changes not in the commit: a result here may not hold for the commit alone', 'warn') : '')
        : chip('version', 'version unknown', 'No git commit was recorded'));
    const strip = [...byCase.values()].sort((a, b) => a.order - b.order)
      .map(t => `<a class="${t.result}" href="#${esc(t.case)}" data-case="${esc(t.case)}" title="${esc(t.case)}"></a>`).join('');
    // one row per category, then the failures (if any), as plain tables
    const rows = cats.map(c => {
      const all = inCat(c), bad = all.filter(t => t.result !== 'pass');
      const slow = [...all].sort((x, y) => y.seconds - x.seconds)[0];
      return `<tr><td><span class="sq ${bad.length ? 'fail' : ''}"></span></td><td><span class="cat">${icon(CAT_ICON[c])}${esc(c)}</span></td>`
        + `<td class="n">${all.length}</td><td class="n">${all.length - bad.length}</td><td class="n ${bad.length ? 'bad' : ''}">${bad.length}</td>`
        + `<td class="n">${secs(all.reduce((n, t) => n + t.seconds, 0))}</td>`
        + `<td><a href="#${esc(slow.case)}" data-case="${esc(slow.case)}">${esc(slow.case)}</a> <span class="n">(${secs(slow.seconds)})</span></td></tr>`;
    }).join('');
    const changes = hasPrev ? `<div class="chips" style="margin-bottom:6px">`
      + chip('history', `${regressions.length} regression${regressions.length === 1 ? '' : 's'}`, 'Passed in an earlier run, fails now', regressions.length ? 'bad' : 'good')
      + (fixed.length ? chip('history', `${fixed.length} fixed`, 'Failed in an earlier run, passes now', 'good') : '')
      + (fresh.length ? chip('plusbox', `${fresh.length} new`, 'No result in an earlier run') : '')
      + (flaky.length ? chip('flaky', `${flaky.length} flaky`, 'Passed and failed on this same version: ' + flaky.map(t => t.case).join(', '), 'warn') : '')
      + (shifted.length ? chip('slower', `${shifted.length} with a changed game time`, shifted.map(t => t.case).join(', '), 'warn') : '') + '</div>'
      : `<div class="chips" style="margin-bottom:6px">${chip('history', 'first run: nothing to compare with')}</div>`;
    // what kinds of test each feature has: one with only positive tests never checks it refuses, or where its limits are
    const feats = [...new Set(tests.map(t => t.feature || 'Untagged'))];
    const covRows = feats.map(f => {
      const all = tests.filter(t => (t.feature || 'Untagged') === f);
      const n = k => all.filter(t => kindOf(t) === k).length, bugs = all.filter(t => t.bug).length;
      const gaps = KINDS.filter(k => !n(k)).map(k => 'no ' + k);
      return `<tr><td><span class="sq ${all.some(t => t.result !== 'pass') ? 'fail' : ''}"></span></td><td>${esc(f)}</td><td class="n">${all.length}</td>`
        + KINDS.map(k => `<td class="n ${n(k) ? '' : 'warn'}">${n(k)}</td>`).join('') + `<td class="n">${bugs}</td>`
        + `<td>${gaps.length ? chip('alert', gaps.join(', '), 'Kinds of test this feature has none of', 'warn') : chip('check', 'all three', '', 'good')}</td></tr>`;
    }).join('');
    const coverage = `<table class="sum"><thead><tr><th></th><th>Feature</th><th>Tests</th><th>Positive</th><th>Negative</th><th>Boundary</th><th>From bugs</th><th>Gaps</th></tr></thead><tbody>${covRows}</tbody></table>`;
    const table = `<table class="sum"><thead><tr><th></th><th>Category</th><th>Tests</th><th>Passed</th><th>Failed</th><th>Game time</th><th>Slowest</th></tr></thead><tbody>${rows}</tbody></table>`;
    const failTable = failed.length ? `<table class="sum"><thead><tr><th></th><th>Failed test</th><th>Before</th><th>Step</th><th>Why</th></tr></thead><tbody>`
      + failed.map(t => {
        const step = t.steps.find(s => s.state === 'failed');
        return `<tr><td><span class="sq fail"></span></td><td><a href="#${esc(t.case)}" data-case="${esc(t.case)}">${esc(t.case)}</a></td><td>${change(t) === 'regression' ? `<span class="cat" style="color:var(--fail)" title="${esc(before(t).run)}">${icon('history')}passed at ${esc(ver(before(t)))}</span>` : change(t) === 'flaky' ? 'flaky: passed too' : change(t) === 'new' ? 'new' : before(t) ? 'failed too' : ''}</td><td>${esc(step ? step.label : '')}</td><td>${esc(t.message)}</td></tr>`;
      }).join('') + '</tbody></table>' : '';
    return `<section id="sec-summary"><div class="sechead"><h2>Summary</h2></div><div class="chips">${facts}</div>
      <div class="tally">${tally}</div>${changes}<div class="strip">${strip}</div>${table}${failTable}${coverage}</section>`;
  }

  function card(t) {
    const pic = t.video
      ? `<div class="thumb"><img src="${esc(t.video.replace(/\.mp4$/, '.jpg'))}" alt="" loading="lazy" onerror="this.remove()"></div>`
      : `<div class="nothumb">no video (headless run without --video)</div>`;
    return `<button class="test ${t.result}" id="${esc(t.case)}" data-case="${esc(t.case)}">${pic}
      <div class="body"><div class="name"><span class="sq" title="${t.result === 'pass' ? 'passed' : 'failed'}"></span>${esc(t.case)}</div>
      <div class="chips">${changeChip(t)}${kindChips(t)}${chip('clock', secs(t.seconds), 'Game time')}${chip('steps', `${t.steps.length} steps`)}</div>
      ${t.result === 'pass' ? '' : `<div class="why">${icon('alert')}<span>${esc(t.message)}</span></div>`}</div></button>`;
  }

  // a section's tests in a group per kind: positive, negative, boundary (then any untagged), each headed with its count
  const KIND_HEAD = { positive: 'Positive: does what it should', negative: 'Negative: refuses or stops when it should', boundary: 'Boundary: either side of a limit', '': 'Untagged' };
  function groups(list, c) {
    return [...KINDS, ''].map(k => { const g = list.filter(t => kindOf(t) === k); if (!g.length) return '';
      return `<div class="kindhead ${k || 'untagged'}" id="${slug(c)}-${k || 'untagged'}">${icon(k || 'alert')}<h3>${esc(KIND_HEAD[k])}</h3><span class="count">${g.length}</span></div><div class="tests">${g.map(card).join('')}</div>`;
    }).join('');
  }

  function categoryHtml(c) {
    const all = inCat(c), shown = onlyFailed ? all.filter(t => t.result !== 'pass') : all;
    const bad = all.filter(t => t.result !== 'pass').length;
    return `<section id="${slug(c)}"><div class="sechead"><h2>${esc(c)}</h2><div class="chips">${chip('tests', `${all.length} tests`)}`
      + (bad ? chip('x', `${bad} failed`, '', 'bad') : chip('check', 'all passed', '', 'good')) + '</div></div>'
      + (shown.length ? groups(shown, c) : '<div class="nothing">Nothing failed here.</div>') + '</section>';
  }

  // every case's last runs side by side: a square per run, outlined where its version was flaky, and a line of its game time
  function historyHtml() {
    if (!hasPrev) return '';
    const runs = [...new Set([...tests.flatMap(t => history(t).map(r => r.run)), folder])].sort().slice(-14);
    const head = runs.map(r => { const v = r === folder ? tests[0].version : (tests.flatMap(history).find(x => x.run === r) || {}).version;
      return `<th class="c ${r === folder ? 'now' : ''}" title="${esc(r)}${v ? ' at ' + esc(v) : ''}">${esc(r.slice(5, 16).replace('_', ' '))}</th>`; }).join('');
    const spark = vals => { const v = vals.filter(x => x != null); if (v.length < 2) return '';
      const lo = 0, hi = Math.max(...v), span = hi || 1;   // from zero, so a small change looks small
      const pts = vals.map((x, i) => x == null ? null : `${(i / (vals.length - 1) * 116 + 2).toFixed(1)},${(20 - (x - lo) / span * 18).toFixed(1)}`).filter(Boolean).join(' ');
      return `<svg class="spark" viewBox="0 0 120 22" aria-hidden="true"><polyline points="${pts}"/></svg>`; };
    const rows = [...byCase.values()].sort((a, b) => a.order - b.order).map(t => {
      const all = [...history(t), { ...t, run: folder }], fv = flakyVersions(t);
      const cells = runs.map(r => { const x = all.filter(y => y.run === r).at(-1);
        if (!x) return '<td class="c"><span class="sq none" title="not run"></span></td>';
        return `<td class="c"><span class="sq ${x.result === 'pass' ? '' : 'fail'} ${fv.includes(x.version) ? 'flaky' : ''}" title="${esc(r)}: ${x.result}, ${secs(x.seconds)}${x.version ? ' at ' + esc(x.version) : ''}${x.result === 'pass' ? '' : ' — ' + esc(x.message)}"></span></td>`; }).join('');
      const times = runs.map(r => { const x = all.filter(y => y.run === r).at(-1); return x && x.result === 'pass' ? x.seconds : null; });
      return `<tr><td><a href="#${esc(t.case)}" data-case="${esc(t.case)}">${esc(t.case)}</a></td>${cells}<td>${spark(times)}</td><td>${changeChip(t)}</td></tr>`;
    }).join('');
    return `<section id="sec-history"><div class="sechead"><h2>History</h2><div class="chips">${chip('history', `the last ${runs.length} runs`)}`
      + (flaky.length ? chip('flaky', `${flaky.length} flaky`, '', 'warn') : chip('check', 'nothing flaky', 'No test both passed and failed on one version', 'good')) + `</div></div>`
      + `<table class="sum hist"><thead><tr><th>Test</th>${head}<th>Game time (passes)</th><th></th></tr></thead><tbody>${rows}</tbody></table></section>`;
  }

  function draw() {
    $('nav').innerHTML = navHtml();
    $('main').innerHTML = summaryHtml() + cats.map(categoryHtml).join('') + historyHtml();
    spy();
  }

  // the nav marks the section on screen
  let observer;
  function spy() {
    if (observer) observer.disconnect();
    observer = new IntersectionObserver(entries => {
      const seen = entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
      if (!seen) return;
      const sub = document.querySelector(`.navlink.sub[data-sec="${seen.target.id}"]`);
      document.querySelectorAll('.navlink').forEach(a => a.classList.toggle('on', a.dataset.sec === seen.target.id || (sub && a.dataset.sec === sub.dataset.parent)));
    }, { rootMargin: '0px 0px -70% 0px' });
    document.querySelectorAll('main section, main .kindhead').forEach(s => observer.observe(s));
  }

  function open(name) {
    const t = byCase.get(name);
    if (!t) return;
    const markOf = { done: 'check', failed: 'x', 'not reached': 'dash' };
    const steps = t.steps.map(s => `<li class="${s.state.replace(' ', '')}" title="${esc(s.state)}"><span class="mark">${icon(markOf[s.state] || 'dash')}</span><span>${esc(s.label)}</span>${s.seconds == null ? '<span></span>' : chip('clock', secs(s.seconds))}</li>`).join('');
    const minds = (t.robots || []).map(r => `<div class="box"><div class="head">${icon('robot')}${esc(r.name)} remembers last</div>
      <ul class="memory">${r.memory.length ? r.memory.map(m => `<li>${esc(m)}</li>`).join('') : '<li class="empty">nothing</li>'}</ul></div>`).join('');
    $('dlg').innerHTML = `<div class="detail">
      <div>${t.video ? `<video src="${esc(t.video)}" controls autoplay muted></video>` : '<div class="nothumb">no video (headless run without --video)</div>'}</div>
      <div class="side ${t.result}"><div class="sidehead"><h2><span class="sq"></span><span>${esc(t.case).replace(/_/g, '_<wbr>')}</span></h2>
        <button class="btn close" onclick="dlg.close()">${icon('x')}Close</button></div>
        <div class="chips">${changeChip(t)}${t.feature ? chip('folder', t.feature) : ''}${kindChips(t)}${chip(CAT_ICON[cat(t)], cat(t))}${chip('clock', secs(t.seconds), 'Game time')}${chip('flag', 'ended ' + t.ended.slice(11), t.ended)}${t.version ? chip('version', t.version, 'The game version this ran on') : ''}${chip('steps', `${t.steps.length} steps`)}</div>
        ${t.result === 'pass' ? '' : `<div class="why">${icon('alert')}<span style="-webkit-line-clamp:unset">${esc(t.message)}</span></div>`}
        ${t.bug ? `<div class="box"><div class="head">${icon('bug')}Written for a bug</div><div class="body" style="font-size:13px">${esc(t.bug)}</div></div>` : ''}
        <div class="box"><div class="head">${icon('steps')}Steps</div><ol class="steps">${steps}</ol></div>${minds}</div></div>`;
    $('dlg').showModal();
  }
  $('dlg').addEventListener('close', () => { const v = $('dlg').querySelector('video'); if (v) v.pause(); $('dlg').innerHTML = ''; });   // its video unloaded

  document.addEventListener('click', e => {
    if (e.target.closest('#onlyFailed')) { onlyFailed = !onlyFailed; draw(); return; }
    const t = e.target.closest('[data-case]');
    if (t) { e.preventDefault(); open(t.dataset.case); }
  });
  draw();
  if (location.hash && byCase.has(decodeURIComponent(location.hash.slice(1)))) open(decodeURIComponent(location.hash.slice(1)));   // report.html#<case>

  // while a run may still be going (nothing yet, or a result in the last two minutes): every 5 s read results.js again
  // on the side, and reload only when it has more results than are shown
  const last = LW.length ? new Date(LW[LW.length - 1].ended.replace(' ', 'T')) : null;
  if (!last || Date.now() - last < 120000) {
    const timer = setInterval(() => {
      const shown = LW.length;
      window.LW = [];
      const s = document.createElement('script');
      s.src = 'results.js?' + Date.now();
      s.onload = () => {
        const now = window.LW.length;
        s.remove();
        if (now > shown && !$('dlg').open) location.reload();
        else if (now && Date.now() - new Date(window.LW[now - 1].ended.replace(' ', 'T')) > 120000) clearInterval(timer);
      };
      document.head.appendChild(s);
    }, 5000);
  }
</script>
</body>
</html>
